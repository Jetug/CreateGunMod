modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
logoFile="logo.png"
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
credits = "Alessandra15204 - Italian localisation"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config = "cgs.mixin.json"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"
[[dependencies."${mod_id}"]]
modId = "minecraft"
type="required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId="ntgl"
type="required"
versionRange="[1.21.1-3.0.0,)"
ordering="AFTER"
side="BOTH"
[[dependencies."${mod_id}"]]
modId="create"
type="required"
versionRange="[0.5.1.f-26,)"
ordering="AFTER"
side="BOTH"
