plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

version = "${minecraft_version}-${mod_version}"
group = 'com.nukateam.cgs'

base {
    archivesName = "create-gunsmithing"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
//    mavenLocal()
//
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
//    maven {
//        name 'tterrag maven'
//        url 'https://maven.tterrag.com'
//    }
//
//    maven {
//        name = "Jared's maven"
//        url = "https://maven.blamejared.com/"
//    }
//
//    maven {
//        name "Progwml6 maven"
//        url "https://dvs1.progwml6.com/files/maven/"
//    }
//
    maven {
        url "https://www.cursemaven.com"
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }

    maven { url "https://maven.shedaniel.me/" }

    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // for local dev
    implementation 'com.nukateam.ntgl:ntgl:1.21.1-3.1.5'
//    implementation "maven.modrinth:ntgl:y0nwfLDn" // 3.1.1
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:4.8.4"

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

//    implementation "curse.maven:framework-549225:7530361"
    implementation "curse.maven:playeranimator-658587:7389814"
    implementation "curse.maven:cloth-config-348521:5729127"
//    implementation "curse.maven:configured-457570:7276577"

    implementation "curse.maven:kotlin-for-forge-351264:7471280"
    implementation "curse.maven:fzzy-config-1005914:7568897"
//    implementation "maven.modrinth:subtle-effects:s3Fo4cDk"
    implementation "maven.modrinth:jade:15.10.5+neoforge"

    compileOnly "mezz.jei:jei-1.21.1-common-api:19.25.0.322"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.25.0.322"
    localRuntime "mezz.jei:jei-1.21.1-neoforge:19.25.0.322"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
